# tenant_spec.yaml — single source of truth for the synthetic test tenant.
# The generator builds the tenant from this file; the oracle computes expected access from it.
# Secrets (passwords) are NOT stored here — they come from .env.

version: 1

naming:
  prefix: "ll-"                 # every generated user/group/file name starts with this
  domain: "leaklabdev.onmicrosoft.com"   # verified 2026-10-15 (users created under it)
  seed: 20261014                # fixed seed: same spec + same generation -> same canaries and content
  # TEMPLATE generation id. Every teardown + generate is a new generation; a run replaces this with
  # the id of the live tenant (G + the container folder's creation time in base 36), so canaries of
  # different generations never collide even if an index still holds documents of an old one.
  generation: "G000000"

site:
  title: "LeakLab"
  # Create this communication site manually in the SharePoint UI (Day 0).
  url: "https://leaklabdev.sharepoint.com/sites/LeakLab"   # verified 2026-10-15 (Graph + REST)
  library: "Documents"
  # Who gets access at the site root. Everything that inherits gets this.
  root_grants:
    - principal: { kind: entra_group, ref: grp-all-staff }
      role: read
    - principal: { kind: user, ref: admin }
      role: full_control

# ---------------------------------------------------------------------------
# Users: 13 total. 7 are personas (we acquire tokens for them and query as them).
# The rest exist only to make group membership realistic.
# licensed: whether to assign an M365 license (keep to 2-3 to control cost).
# ---------------------------------------------------------------------------
users:
  - { id: admin,     display: "LeakLab Admin",        persona: false, licensed: true,  note: "your own admin account; not generated" }
  - { id: p-intern,  display: "Ivy Intern",           persona: true,  licensed: true  }
  - { id: p-plateng, display: "Paul Platform",        persona: true,  licensed: true  }
  - { id: p-finana,  display: "Fiona Analyst",        persona: true,  licensed: false }
  - { id: p-finlead, display: "Felix FinanceLead",    persona: true,  licensed: false }
  - { id: p-hr,      display: "Hana HR",              persona: true,  licensed: false }
  - { id: p-ceo,     display: "Cora CEO",             persona: true,  licensed: false }
  # S2 benchmark persona: reads ONLY S2-Nested/, through two nested Entra groups, so the S2 scenario
  # shares no user, group, folder or document with the S1 arms and can run beside S1-entra.
  - { id: p-nest,    display: "Nina Nested",          persona: true,  licensed: false }
  - { id: u-eng1,    display: "Eli Engineer",         persona: false, licensed: false }
  - { id: u-eng2,    display: "Erin Engineer",        persona: false, licensed: false }
  - { id: u-fin1,    display: "Frank Finance",        persona: false, licensed: false }
  - { id: u-hr1,     display: "Hugo HR",              persona: false, licensed: false }
  - { id: u-board1,  display: "Bea Board",            persona: false, licensed: false }

# ---------------------------------------------------------------------------
# Entra security groups. Nesting is expressed with member_groups.
# Nesting depth reaches 3 levels: all-staff > engineering > eng-platform.
# ---------------------------------------------------------------------------
groups:
  - id: grp-all-staff
    members: [p-intern, u-hr1, u-board1]
    member_groups: [grp-engineering, grp-finance, grp-hr]
  - id: grp-engineering
    members: [u-eng1]
    member_groups: [grp-eng-platform]
  - id: grp-eng-platform
    members: [p-plateng, u-eng2]
    member_groups: []
  - id: grp-finance
    members: [p-finana, u-fin1]
    member_groups: [grp-finance-leads]
  - id: grp-finance-leads
    members: [p-finlead]
    member_groups: []
  - id: grp-hr
    members: [p-hr]
    member_groups: []
  - id: grp-board
    members: [p-ceo, u-board1]
    member_groups: []
  # S1 control arms (see folders S1-Entra / S1-SPGroup / S1-Direct): the same user, three ways in.
  - id: grp-s1-entra
    members: [p-plateng]
    member_groups: []
  # S2 (nested removal): p-nest is in grp-s2-inner, which is inside grp-s2-outer (granted on S2-Nested/).
  - id: grp-s2-outer
    members: []
    member_groups: [grp-s2-inner]
  - id: grp-s2-inner
    members: [p-nest]
    member_groups: []

# ---------------------------------------------------------------------------
# SharePoint groups (site groups). Members are users only: an Entra group inside a SharePoint group
# is not verified, so it is not modelled. Title in the tenant: "<prefix><id>".
# ---------------------------------------------------------------------------
sp_groups:
  - id: sp-s1-spgroup
    members: [p-plateng]

# ---------------------------------------------------------------------------
# Folder tree. inherits: true  -> effective access = parent's effective access
#              inherits: false -> unique permissions; ONLY the listed grants apply
# ---------------------------------------------------------------------------
folders:
  - path: "General"
    inherits: true
    doc_count: 6
  - path: "Engineering"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-engineering }, role: read }
    doc_count: 6
  - path: "Engineering/Platform-Secrets"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-eng-platform }, role: read }
    doc_count: 5
  - path: "Finance"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-finance }, role: read }
    doc_count: 6
  - path: "Finance/Leadership"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-finance-leads }, role: read }
    doc_count: 4
  - path: "HR"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-hr }, role: read }
    doc_count: 5
  - path: "Board"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-board }, role: read }
      - { principal: { kind: user, ref: p-ceo }, role: read }   # direct user grant as well
    doc_count: 4
  # S1 control arms: p-plateng reads these 2 documents through three different kinds of grant.
  # Measured 2026-10-16 (docs/FINDINGS.md): direct and SharePoint-group changes took effect within
  # ~16s, Entra-group changes took ~36 min. These folders let a system be compared against that.
  - path: "S1-Entra"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-s1-entra }, role: read }
    doc_count: 2
  - path: "S1-SPGroup"
    inherits: false
    grants:
      - { principal: { kind: sp_group, ref: sp-s1-spgroup }, role: read }
    doc_count: 2
  - path: "S1-Direct"
    inherits: false
    grants:
      - { principal: { kind: user, ref: p-plateng }, role: read }
    doc_count: 2
  # S2 benchmark folder: only p-nest reads it (through grp-s2-outer > grp-s2-inner).
  - path: "S2-Nested"
    inherits: false
    grants:
      - { principal: { kind: entra_group, ref: grp-s2-outer }, role: read }
    doc_count: 2

# ---------------------------------------------------------------------------
# Individually-permissioned files (edge cases). These sit inside a folder but
# have their own unique grants.
# ---------------------------------------------------------------------------
special_files:
  - id: f-direct-share
    folder: "General"
    name: "offer-letter-draft.txt"
    inherits: false
    grants:
      - { principal: { kind: user, ref: p-hr }, role: read }
      - { principal: { kind: user, ref: p-ceo }, role: read }
    note: "Edge case: uniquely-shared file inside a broadly visible folder. Later moved into Board/ in a scenario."

# ---------------------------------------------------------------------------
# Documents: generated per folder (doc_count). Every document contains exactly
# one canary string, unique across the tenant, derived deterministically from
# seed + folder + index. Format: CANARY-<folder_code>-<nn>-<6 hex>
# ---------------------------------------------------------------------------
documents:
  format: txt                   # start with .txt; add docx only after a probe confirms indexing
  canary_pattern: "CANARY-{generation}-{folder_code}-{index:02d}-{hex6}"
  # Special files (see special_files) get exactly one canary each, derived from seed + file id.
  # Placeholders: {hex6}, {file_id}. They are extra: they do not count toward a folder's doc_count.
  special_canary_pattern: "CANARY-{generation}-SPC-{hex6}"
  folder_codes:
    "General": GEN
    "Engineering": ENG
    "Engineering/Platform-Secrets": PLT
    "Finance": FIN
    "Finance/Leadership": FLD
    "HR": HR
    "Board": BRD
    "S1-Entra": S1E
    "S1-SPGroup": S1S
    "S1-Direct": S1D
    "S2-Nested": S2N
  body_template: |
    {title}
    This is a synthetic test document for the LeakLab benchmark.
    Topic: {topic}
    Reference code: {canary}
    {filler}
  topics: [budget, roadmap, salaries, incident review, hiring plan, vendor contract, board minutes]

# ---------------------------------------------------------------------------
# Policy decisions the oracle needs (ambiguous cases are made explicit).
# ---------------------------------------------------------------------------
policy:
  org_wide_sharing_link: accessible_not_discoverable   # placeholder; edge case decided later
  unknown_principal: deny
  guest_users: deny_unless_explicit

# ---------------------------------------------------------------------------
# Scenario catalogue (implemented in Week 2). Listed now so the spec and
# oracle are designed for them from the start.
# ---------------------------------------------------------------------------
scenarios:
  # `mutations` is what the runner applies (same shape as leaklab.oracle.Mutation: type + params).
  # `control` (optional) is a folder whose canaries must stay readable; the runner polls one of them.
  - id: S1-parent-revocation
    description: "Remove grp-engineering's grant on Engineering/ (affects inherited children)."
    mutations:
      - type: grant_removed
        params: { target: "Engineering", principal_kind: entra_group, principal_ref: grp-engineering }
  # S2 as benchmarked: its own persona, groups and folder (nothing shared with the S1 arms).
  - id: S2-nested-group-removal
    description: "Remove grp-s2-inner from grp-s2-outer (p-nest loses S2-Nested/ through the nesting)."
    mutations:
      - type: group_member_removed
        params: { group: grp-s2-outer, member_kind: entra_group, member_ref: grp-s2-inner }
    control: "General"
  # The first S2 scenario, kept for its coverage: nesting inside the company hierarchy.
  - id: S2-engineering-nested-removal
    description: "Remove grp-eng-platform from grp-engineering."
    mutations:
      - type: group_member_removed
        params: { group: grp-engineering, member_kind: entra_group, member_ref: grp-eng-platform }
  - id: S4-move-into-restricted
    description: "Move f-direct-share from General/ into Board/."
    mutations:
      - type: file_moved
        params: { file: f-direct-share, to_folder: "Board" }
  - id: S6-cached-answer
    description: "p-finlead's cached answer about Finance/Leadership must not reach p-intern."
  # The three S1 control arms: revoke p-plateng's access in each way. Their control is a folder that
  # none of the three touches (p-plateng reads it through grp-eng-platform, one Entra hop).
  - id: S1-entra
    description: "Remove p-plateng from grp-s1-entra (Entra group granted Read on S1-Entra/)."
    mutations:
      - type: group_member_removed
        params: { group: grp-s1-entra, member_kind: user, member_ref: p-plateng }
    control: "Engineering/Platform-Secrets"
  - id: S1-spgroup
    description: "Remove p-plateng from sp-s1-spgroup (SharePoint group granted Read on S1-SPGroup/)."
    mutations:
      - type: group_member_removed
        params: { group: sp-s1-spgroup, member_kind: user, member_ref: p-plateng }
    control: "Engineering/Platform-Secrets"
  - id: S1-direct
    description: "Remove p-plateng's own Read grant on S1-Direct/."
    mutations:
      - type: grant_removed
        params: { target: "S1-Direct", principal_kind: user, principal_ref: p-plateng }
    control: "Engineering/Platform-Secrets"
