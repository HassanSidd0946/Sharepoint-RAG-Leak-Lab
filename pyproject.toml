[project]
name = "leaklab"
version = "0.1.0"
description = "Benchmark and prototype for permission-aware RAG over SharePoint (leak lab)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "msal",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "typer",
    "rich",
    "cryptography",
    "psycopg[binary,pool]>=3.3.6",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "pyjwt[crypto]>=2.15.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgserver>=0.1.4",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "hypothesis>=6.170.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaklab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "probes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*setup_b*.py" = ["E501"]  # long module docstrings and recorded labels in the Setup B tests
"probes/*delta_probe.py" = ["E501"]  # long recorded change labels
"probes/search_*.py" = ["E501"]  # long REST bodies and request recordings read better unbroken
"probes/*" = ["B008"]  # typer.Option(...) in argument defaults is typer's normal usage
"src/leaklab/runner/cli.py" = ["B008"]
"src/leaklab/benchmark/cli.py" = ["B008"]  # same: typer.Option(...) defaults
"src/leaklab/setup_b/recall.py" = ["B008"]
"src/leaklab/agent/**" = ["E501", "B008"]  # long SQL strings and docstrings in the agent package
"src/leaklab/replay/**" = ["E501", "B008"]  # long label strings; typer options
"tests/*agent*.py" = ["E501"]
"tests/*s6*.py" = ["E501"]
"tests/*replay*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true  # msal ships no type information

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true  # no stubs installed; used only to validate bundles

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true  # optional: only for the exploratory --real-llm

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call real Microsoft/Azure endpoints; skipped unless --live is passed",
]
